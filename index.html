<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subsumtions-Trainer SGB III</title>
<style>
:root{
  --bg:#f2f4f9;--card:#ffffff;--text:#172033;--muted:#4a5670;--line:#d6dcea;
  --accent:#2350c8;--accent-weak:#e4ebfb;--on-accent:#ffffff;--glow:rgba(35,80,200,.35);
  --ok:#17703a;--ok-bg:#e3f5e9;--ok-glow:rgba(40,190,100,.45);--bad:#b0261d;--bad-bg:#fbe8e6;--hint:#7a5000;--hint-bg:#fff4d4;
  --focus:#ffbf47;--radius:14px;
  --p-norm:#2350c8;--p-fact:#a45a00;--p-cmp:#6a3aa8;--p-res:#17703a;
  --hl-norm:#b9d2ff;--hl-fact:#ffd29a;--hl-cmp:#dcc8ff;--hl-res:#b2efc4;--hl-yellow:#ffe866;
  --shadow:0 1px 2px rgba(23,32,51,.06),0 6px 20px rgba(23,32,51,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d111d;--card:#161c2c;--text:#e9edf7;--muted:#a7b1c7;--line:#2a3350;
    --accent:#86a8ff;--accent-weak:#1d2a4a;--on-accent:#0c1224;--glow:rgba(120,160,255,.55);
    --ok:#6fe39a;--ok-bg:#12291d;--ok-glow:rgba(90,230,140,.5);--bad:#ff8f86;--bad-bg:#351a1a;--hint:#ffd064;--hint-bg:#30280f;
    --p-norm:#86a8ff;--p-fact:#ffb85c;--p-cmp:#c7a6ff;--p-res:#6fe39a;
    --hl-norm:rgba(120,160,255,.30);--hl-fact:rgba(255,170,70,.30);--hl-cmp:rgba(190,150,255,.30);--hl-res:rgba(90,230,140,.28);--hl-yellow:rgba(255,225,70,.30);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{font-size:106.25%}
body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6;
  background:var(--bg);
  background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);background-size:22px 22px;background-attachment:fixed}
.skip{position:absolute;left:-999px;top:0;background:var(--focus);color:#000;padding:.5rem 1rem;z-index:10}
.skip:focus{left:0}
.wrap{max-width:46rem;margin:0 auto;padding:1rem 1rem 3rem}
header.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:.25rem 1rem;align-items:center;justify-content:space-between;padding:.5rem 1rem;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .brand{font-weight:700;display:flex;align-items:center;gap:.55rem}
.brand-mark{display:grid;place-items:center;width:2rem;height:2rem;border-radius:9px;background:var(--accent);color:var(--on-accent);font-weight:800;box-shadow:0 0 14px var(--glow)}
header.top nav{display:flex;gap:.1rem;flex-wrap:wrap}
h1{font-size:1.7rem;line-height:1.25;margin:.4rem 0 .6rem;letter-spacing:-.01em}
h2{font-size:1.25rem;line-height:1.3;margin:0 0 .75rem}
h3{font-size:1.05rem;margin:1.25rem 0 .5rem}
p{margin:.5rem 0}
.small{font-size:.9rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;margin:1rem 0;box-shadow:var(--shadow)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.55rem 1rem;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:650;box-shadow:0 4px 14px var(--glow)}
.btn.primary:hover:not(:disabled){box-shadow:0 6px 22px var(--glow)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.link{background:none;border:none;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:.4rem .5rem;min-height:44px}
.term{background:none;border:none;padding:0;color:inherit;text-decoration:underline dotted 2px;text-decoration-color:var(--accent);text-underline-offset:3px;cursor:help;font:inherit}
.term:hover{background:var(--hl-yellow);border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Textmarker-Grundlage */
.hl{background-repeat:no-repeat;background-position:0 90%;background-size:100% 45%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em}

/* Hero */
.hero{font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.2}
.hero .hl{background-image:linear-gradient(var(--hl-yellow),var(--hl-yellow))}

/* Übersicht / Lernpfad */
.path{list-style:none;margin:0;padding:0}
.path li{position:relative;display:flex;gap:.9rem;align-items:flex-start;padding:.8rem 0}
.path li:not(:last-child)::before{content:"";position:absolute;left:calc(1.2rem - 2px);top:3.1rem;bottom:-.7rem;width:4px;border-radius:4px;background:var(--line)}
.path li.done:not(:last-child)::before{background:var(--ok);box-shadow:0 0 8px var(--ok-glow)}
.path .num{position:relative;z-index:1;flex:0 0 2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-weight:750;border:2px solid var(--line);background:var(--card)}
.path li.done .num{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);box-shadow:0 0 12px var(--ok-glow)}
.path li.next .num{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 0 5px var(--accent-weak),0 0 22px var(--glow)}
.path li.locked{opacity:.6}
.path .body{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.7rem .9rem;box-shadow:var(--shadow)}
.path li.next .body{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 26px var(--glow)}
.path .t{font-weight:650}
.path .status{font-size:.85rem;color:var(--muted)}
.path .btn{margin-top:.5rem}
.bar{height:.65rem;background:var(--line);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--ok));box-shadow:0 0 12px var(--glow)}

/* Station */
.kicker{color:var(--muted);font-size:.9rem;margin:0}
.case{position:relative;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--p-fact);border-radius:6px var(--radius) var(--radius) 6px;padding:.8rem 1rem;margin:1rem 0;box-shadow:var(--shadow)}
.case-title{font-weight:700;margin:0 0 .25rem;color:var(--p-fact)}
details.norm{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--p-norm);border-radius:6px var(--radius) var(--radius) 6px;padding:.6rem 1rem;margin:1rem 0;box-shadow:var(--shadow)}
details.norm summary{cursor:pointer;font-weight:650;min-height:32px;color:var(--p-norm)}
.norm-item{margin:.6rem 0;font-family:Georgia,"Times New Roman",serif;line-height:1.7}
.norm-item strong{display:block;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.norm-note{font-size:.85rem;color:var(--muted)}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;margin:1rem 0;box-shadow:var(--shadow)}
.step h2:focus{outline:none}
.opts{display:grid;gap:.6rem;margin-top:.75rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:.75rem .9rem;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.opt .mk{flex:0 0 1.5rem;height:1.5rem;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:.85rem;font-weight:800}
.opt.is-ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 0 18px var(--ok-glow)}
.opt.is-ok .mk{border-color:var(--ok);background:var(--ok);color:var(--card)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-bg);opacity:.8}
.opt.is-bad .mk{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.seg{border:2px dashed var(--line);background:transparent;border-radius:6px;padding:.25rem .45rem;margin:.2rem .1rem;min-height:40px;text-align:left;line-height:1.5}
.seg:hover:not(:disabled){border-color:var(--p-fact)}
.seg[aria-pressed="true"]{border-style:solid;border-color:var(--p-fact);background:var(--hl-yellow);font-weight:600;box-shadow:0 0 14px var(--hl-yellow)}
.seg.is-ok{border-color:var(--ok);background:var(--hl-res);box-shadow:0 0 16px var(--ok-glow)}
.seg.is-bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:none}
.arow{display:grid;grid-template-columns:1fr;gap:.35rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:none}
.arow select{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:.3rem .5rem;max-width:100%}
.arow .astat{font-size:.9rem;font-weight:600}
.arow.is-ok select{border-color:var(--ok);box-shadow:0 0 10px var(--ok-glow)}
.arow.is-ok .astat{color:var(--ok)}
.arow.is-bad select{border-color:var(--bad)}
.arow.is-bad .astat{color:var(--bad)}
@media (min-width:640px){.arow{grid-template-columns:1fr 15rem;align-items:center}.arow .astat{grid-column:1 / -1}}
.olist{list-style:none;padding:0;margin:.75rem 0}
.olist li{display:flex;gap:.5rem;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.5rem .6rem;margin:.4rem 0}
.olist li .ot{flex:1}
.olist li.is-ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 0 12px var(--ok-glow)}
.olist li.is-bad{border-color:var(--bad);background:var(--bad-bg)}
.olist .mv{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:8px}
.olist .pos{font-weight:800;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:.85rem}
.num-in{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.75rem}
.num-in input{width:7rem;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem;background:var(--bg);font-size:1.1rem;font-weight:600}
textarea{width:100%;min-height:9rem;border:1px solid var(--line);border-radius:10px;padding:.7rem;background:var(--bg);line-height:1.5}
.bausteine{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.bausteine .btn{font-size:.9rem;padding:.35rem .7rem;border-style:dashed}
.checks{list-style:none;padding:0;margin:.5rem 0}
.checks li{padding:.2rem 0}
.checks .y{color:var(--ok);font-weight:700}
.checks .n{color:var(--bad);font-weight:700}
.fb{margin:1rem 0;border-radius:12px}
.fb:empty{display:none}
.fb.ok,.fb.bad,.fb.hint{padding:.75rem 1rem;border:1px solid;border-left-width:6px}
.fb.ok{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 0 18px var(--ok-glow)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.hint{background:var(--hint-bg);border-color:var(--hint)}
.fb .lead{font-weight:750;margin-right:.3rem}
.stepnav{display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem}
.merk{border-left:6px solid var(--accent);background:var(--card);box-shadow:var(--shadow);padding:.65rem .95rem;border-radius:6px 12px 12px 6px;margin:.8rem 0}
.merk::before{content:"Merksatz: ";font-weight:750;color:var(--accent)}
.formula{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0}
.muster{border:2px solid var(--ok);border-radius:var(--radius);padding:.9rem 1rem;margin:.8rem 0;background:var(--card);box-shadow:0 0 22px var(--ok-glow);line-height:1.85}
.muster-h{font-weight:750;color:var(--ok);margin:0 0 .4rem}
.p{background-repeat:no-repeat;background-position:0 92%;background-size:100% 48%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .1em}
.p.norm{background-image:linear-gradient(var(--hl-norm),var(--hl-norm))}
.p.fact{background-image:linear-gradient(var(--hl-fact),var(--hl-fact))}
.p.cmp{background-image:linear-gradient(var(--hl-cmp),var(--hl-cmp))}
.p.res{background-image:linear-gradient(var(--hl-res),var(--hl-res))}
.tag{font-size:.72rem;font-weight:750;border-radius:5px;padding:.05rem .35rem;margin-right:.25rem;vertical-align:.1em;color:var(--card)}
.tag.norm{background:var(--p-norm)}.tag.fact{background:var(--p-fact)}.tag.cmp{background:var(--p-cmp)}.tag.res{background:var(--p-res)}
.legend{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.5rem 1rem}
.badge-ring{position:relative;width:7rem;height:7rem;margin:.5rem auto 1rem;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,var(--ok-bg) 55%,transparent 72%);box-shadow:0 0 0 3px var(--ok),0 0 40px var(--ok-glow)}
.done-badge{font-size:3.2rem;line-height:1;margin:0}
.spark{position:absolute;left:50%;top:50%;width:.5rem;height:.5rem;border-radius:50%;background:var(--c);opacity:0;box-shadow:0 0 10px var(--c)}
.speed-case{font-size:1.1rem;font-weight:600}
.timer{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 0 16px var(--glow)}
.timer.low{color:var(--bad);text-shadow:0 0 14px var(--bad)}
dl.reveal{display:grid;grid-template-columns:auto 1fr;gap:.35rem .8rem;margin:.6rem 0;padding:.8rem 1rem;border:2px solid var(--ok);border-radius:12px;box-shadow:0 0 18px var(--ok-glow)}
dl.reveal dt{font-weight:750}
dl.reveal dd{margin:0}
dialog{max-width:32rem;width:calc(100% - 2rem);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:var(--radius);background:var(--card);color:var(--text);padding:1.2rem;box-shadow:0 0 40px var(--glow)}
dialog::backdrop{background:rgba(5,10,25,.55);backdrop-filter:blur(3px)}
.glist dt{font-weight:750;margin-top:.9rem}
.glist dd{margin:.2rem 0 0}
footer.foot{max-width:46rem;margin:0 auto;padding:1rem;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line)}
footer.foot .row{display:flex;flex-wrap:wrap;gap:.25rem}

/* Bewegung – nur wenn erwünscht */
@media (prefers-reduced-motion:no-preference){
  .bar span{transition:width .5s ease}
  .btn,.opt,.seg{transition:border-color .15s,box-shadow .2s,background-color .2s,transform .15s}
  .opt:hover:not(:disabled){transform:translateY(-1px)}
  .hero .hl{animation:sweep 1s .25s ease-out both}
  .muster .p{animation:sweep .6s ease-out both}
  .muster .p:nth-of-type(4){animation-delay:.35s}
  .muster .p:nth-of-type(6){animation-delay:.7s}
  .muster .p:nth-of-type(8){animation-delay:1.05s}
  .path li.next .num{animation:pulse 2.4s ease-in-out infinite}
  .step.flash{animation:flash .9s ease-out}
  .opt.is-bad,.seg.is-bad{animation:shake .35s}
  .seg[aria-pressed="true"]{animation:pop .2s}
  .badge-ring{animation:ring 1s ease-out both}
  .spark{animation:burst 1s ease-out .15s both}
}
@media (prefers-reduced-motion:reduce){ .spark{display:none} }
@keyframes sweep{from{background-size:0% 48%}to{background-size:100% 48%}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px var(--accent-weak),0 0 14px var(--glow)}50%{box-shadow:0 0 0 8px var(--accent-weak),0 0 30px var(--glow)}}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--ok),0 0 34px var(--ok-glow)}100%{box-shadow:var(--shadow)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes ring{from{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}to{transform:scale(1)}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-5.5rem)}}
</style>
</head>
<body>
<a href="#main" class="skip">Zum Inhalt springen</a>
<header class="top">
  <span class="brand"><span class="brand-mark" aria-hidden="true">§</span>Subsumtions-Trainer SGB III</span>
  <nav aria-label="Hauptnavigation">
    <button type="button" class="link" data-act="home">Übersicht</button>
    <button type="button" class="link" data-act="merk">Merksätze</button>
    <button type="button" class="link" data-act="gloss">Glossar</button>
  </nav>
</header>
<main id="main" class="wrap" tabindex="-1"></main>
<footer class="foot">
  <p>Rechtsgrundlagen: SGB III, insbesondere §§ 137, 138, 142. Die Gesetzestexte im Tool sind Auszüge. Maßgeblich ist der aktuelle Wortlaut auf <a href="https://www.gesetze-im-internet.de/sgb_3/" target="_blank" rel="noopener">gesetze-im-internet.de</a>.</p>
  <div class="row">
    <button type="button" class="link" data-act="unlock">Alle Stationen freischalten (Ausbildung)</button>
    <button type="button" class="link" data-act="reset">Fortschritt zurücksetzen</button>
  </div>
</footer>

<dialog id="gdlg" aria-labelledby="gdlgT">
  <h2 id="gdlgT"></h2>
  <p id="gdlgX"></p>
  <button type="button" class="btn primary" id="gdlgClose">Schließen</button>
</dialog>

<script>
"use strict";
/* ================= Speicher ================= */
const STORE = "subsumtions-trainer-sgb3-v1";
let state = { done: {}, unlockAll: false };
function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s && typeof s === "object") state = Object.assign(state, s); }catch(e){} }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

/* ================= Glossar ================= */
const GLOSSAR = {
  "Subsumtion": "Du prüfst, ob ein konkreter Fall die Voraussetzungen eines Gesetzes erfüllt. Du legst das Gesetz wie eine Schablone auf den Fall.",
  "Sachverhalt": "Die Tatsachen des Falls, also das, was passiert ist. Zum Beispiel: „Herr Weber arbeitet 12 Stunden pro Woche.“",
  "Norm": "Eine Rechtsvorschrift, zum Beispiel ein Paragraf oder ein Absatz daraus (§ 138 Abs. 3 SGB III).",
  "Tatbestand": "Alle Voraussetzungen einer Vorschrift zusammen. Das ist das „Wenn“: Wann greift das Gesetz?",
  "Tatbestandsmerkmal": "Eine einzelne Voraussetzung im Tatbestand. Jedes Merkmal wird einzeln geprüft.",
  "Rechtsfolge": "Das, was passiert, wenn der Tatbestand erfüllt ist. Das ist das „Dann“, zum Beispiel ein Anspruch auf Arbeitslosengeld.",
  "Wortlaut": "Der genaue Text des Gesetzes. Kleine Wörter wie „weniger als“ oder „mindestens“ entscheiden oft über das Ergebnis.",
  "kumulativ": "Alle Voraussetzungen müssen zusammen erfüllt sein. Erkennbar meistens an „und“. Fehlt eine, fehlt der Anspruch.",
  "alternativ": "Es reicht, wenn eine von mehreren Möglichkeiten erfüllt ist. Erkennbar meistens an „oder“.",
  "Erwerbstätigkeit": "Oberbegriff in § 138 Abs. 3 SGB III für eine Beschäftigung, eine selbständige Tätigkeit oder eine Tätigkeit als mithelfende Familienangehörige bzw. mithelfender Familienangehöriger.",
  "Beschäftigungslosigkeit": "Die Person steht nicht in einem Beschäftigungsverhältnis (§ 138 Abs. 1 Nr. 1 SGB III). Eine Erwerbstätigkeit unter 15 Stunden pro Woche schadet nicht (§ 138 Abs. 3 SGB III).",
  "Eigenbemühungen": "Die Person bemüht sich selbst, ihre Beschäftigungslosigkeit zu beenden, zum Beispiel durch Bewerbungen (§ 138 Abs. 1 Nr. 2 SGB III).",
  "Verfügbarkeit": "Die Person steht den Vermittlungsbemühungen der Agentur für Arbeit zur Verfügung (§ 138 Abs. 1 Nr. 3 SGB III).",
  "Anwartschaftszeit": "Mindestzeit, in der jemand versichert war. Nach § 142 Abs. 1 SGB III grundsätzlich mindestens 12 Monate Versicherungspflicht in der Rahmenfrist.",
  "Rahmenfrist": "Der Zeitraum, in dem die Anwartschaftszeit erfüllt sein muss. Sie ist in § 143 SGB III geregelt und beträgt grundsätzlich 30 Monate.",
  "Versicherungspflichtverhältnis": "Zum Beispiel eine versicherungspflichtige Beschäftigung, in der Beiträge zur Arbeitslosenversicherung gezahlt werden.",
  "dem Grunde nach": "Der Anspruch besteht grundsätzlich. Fragen wie Höhe, Dauer oder Beginn der Leistung sind damit noch nicht geprüft.",
  "i. V. m.": "Abkürzung für „in Verbindung mit“. Man nutzt sie, wenn eine Vorschrift eine andere ergänzt, z. B. § 137 Abs. 1 Nr. 3 i. V. m. § 142 Abs. 1 SGB III."
};
function fmt(s){
  if(!s) return "";
  return s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => {
    const key = b || a;
    return `<button type="button" class="term" data-term="${key}" aria-haspopup="dialog">${a}</button>`;
  });
}

/* ================= Gesetzestexte (Auszüge) ================= */
const NORMS = {

/* ================= Hilfsfunktionen ================= */
const app = document.getElementById("main");
let timerId = null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function shuffle(a){ const b = a.slice(); for(let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function isUnlocked(i){ return state.unlockAll || i === 0 || !!state.done[STATIONS[i - 1].id]; }
function feedback(kind, html){
  const el = document.getElementById("fb");
  if(!el) return;
  const lead = { ok: "✓ Richtig.", bad: "✗ Noch nicht.", hint: "💡 Tipp:" }[kind];
  el.className = "fb " + kind;
  el.innerHTML = `<span class="lead">${lead}</span>${fmt(html || "")}`;
}
function clearFeedback(){ const el = document.getElementById("fb"); if(el){ el.className = "fb"; el.innerHTML = ""; } }
function focusEl(el){ if(el){ el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: true }); } window.scrollTo(0, 0); }

/* ================= Übersicht ================= */
function showHome(){
  stopTimer();
  const doneCount = STATIONS.filter(s => state.done[s.id]).length;
  const nextIdx = STATIONS.findIndex(s => !state.done[s.id]);
  app.innerHTML = `
    <h1 id="h" class="hero"><span class="hl">Vom Gesetz zum begründeten Ergebnis</span></h1>
    <p>Hier lernst du Schritt für Schritt, wie du einen Fall am Gesetz prüfst – mit Beispielen aus dem SGB III zum Arbeitslosengeld. Du brauchst kein Vorwissen.</p>
    <p class="small">Unterstrichene Begriffe wie [[Tatbestand]] kannst du antippen. Dann erscheint eine kurze Erklärung.</p>
    <div class="card">
      <p><strong>Dein Fortschritt:</strong> ${doneCount} von ${STATIONS.length} Stationen geschafft</p>
      <div class="bar" role="progressbar" aria-label="Gesamtfortschritt" aria-valuemin="0" aria-valuemax="${STATIONS.length}" aria-valuenow="${doneCount}"><span style="width:${Math.round(doneCount / STATIONS.length * 100)}%"></span></div>
    </div>
    <h2>Dein Lernpfad</h2>
    <ol class="path">
      ${STATIONS.map((s, i) => {
        const done = !!state.done[s.id], open = isUnlocked(i), next = i === nextIdx;
        const status = done ? "✓ geschafft" : next && open ? "▶ als Nächstes" : open ? "offen" : "🔒 noch gesperrt – schließe zuerst die vorige Station ab";
        const cls = done ? "done" : next ? "next" : open ? "" : "locked";
        const btn = open ? `<button type="button" class="btn ${next ? "primary" : ""}" data-station="${s.id}">${done ? "Wiederholen" : "Starten"}<span class="sr">: ${s.title}</span></button>` : "";
        return `<li class="${cls}"><span class="num" aria-hidden="true">${done ? "✓" : i + 1}</span><div class="body"><div class="t">${s.title}</div><div class="status">${s.short} · ${status}</div>${btn}</div></li>`;
      }).join("")}
    </ol>`;
  app.innerHTML = fmtOnce(app.innerHTML);
  focusEl(document.getElementById("h"));
}
function fmtOnce(h){ return fmt(h); }

/* ================= Station ================= */
let cur = null;
function showStation(id){
  stopTimer();
  const idx = STATIONS.findIndex(s => s.id === id);
  cur = { st: STATIONS[idx], idx, i: 0, solved: new Set() };
  renderStep();
}
function caseHTML(st){
  if(!st.case) return "";
  return `<section class="case" aria-label="Sachverhalt"><p class="case-title">${st.case.title}</p><p>${st.case.segs.join(" ")}</p></section>`;
}
function normsHTML(keys, closed){
  if(!keys || !keys.length) return "";
  return `<details class="norm" ${closed ? "" : "open"}><summary>Gesetzestext: ${keys.map(k => NORMS[k].t).join(", ")}</summary>
    ${keys.map(k => `<div class="norm-item"><strong>${NORMS[k].t}</strong>${NORMS[k].x}</div>`).join("")}
    <p class="norm-note">Auszug. Maßgeblich ist der aktuelle Wortlaut.</p></details>`;
}
function renderStep(){
  stopTimer();
  const { st, idx, i } = cur;
  const step = st.steps[i], n = st.steps.length;
  const showCase = step.type !== "mark" && step.type !== "write" && step.type !== "speed";
  const normKeys = step.type === "write" ? [step.norm] : st.norms;
  app.innerHTML = `
    <p class="kicker">Station ${idx + 1} von ${STATIONS.length}: ${st.short}</p>
    <h1>${st.title}</h1>
    <div class="bar" role="progressbar" aria-label="Fortschritt in dieser Station" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${i + 1}"><span style="width:${Math.round((i + 1) / n * 100)}%"></span></div>
    <p class="small">Schritt ${i + 1} von ${n}</p>
    ${showCase ? caseHTML(st) : ""}
    ${normsHTML(normKeys, st.normsClosed)}
    <section class="step" aria-labelledby="stepQ">
      <h2 id="stepQ">${fmt(step.q)}</h2>
      <div id="stepBody">${TYPES[step.type].html(step, st)}</div>
    </section>
    <div id="fb" class="fb" role="status" aria-live="polite"></div>
    <div class="stepnav">
      <button type="button" class="btn" id="prevBtn">${i === 0 ? "Zur Übersicht" : "Zurück"}</button>
      <button type="button" class="btn primary" id="nextBtn" disabled>${i === n - 1 ? "Station abschließen" : "Weiter"}</button>
    </div>`;
  const nextBtn = document.getElementById("nextBtn");
  const sec = app.querySelector(".step");
  const solved = quiet => { cur.solved.add(i); nextBtn.disabled = false; if(!quiet){ sec.classList.remove("flash"); void sec.offsetWidth; sec.classList.add("flash"); } };
  if(cur.solved.has(i)) nextBtn.disabled = false;
  TYPES[step.type].bind(step, solved, document.getElementById("stepBody"), st);
  document.getElementById("prevBtn").addEventListener("click", () => { if(i === 0) showHome(); else { cur.i--; renderStep(); } });
  nextBtn.addEventListener("click", () => { if(i === n - 1) completeStation(); else { cur.i++; renderStep(); } });
  focusEl(document.getElementById("stepQ"));
}
function sparks(){
  const cols = ["var(--ok)","var(--accent)","var(--p-fact)","var(--p-cmp)"];
  return Array.from({length: 12}, (x, k) => `<span class="spark" style="--a:${k * 30}deg;--c:${cols[k % 4]}"></span>`).join("");
}
function completeStation(){
  stopTimer();
  const { st, idx } = cur;
  state.done[st.id] = true; save();
  const next = STATIONS[idx + 1];
  app.innerHTML = `
    <div class="card" style="text-align:center">
      <div class="badge-ring" aria-hidden="true"><p class="done-badge">${st.badge}</p>${sparks()}</div>
      <h1 id="h">Station geschafft!</h1>
      <p>Du hast „${st.title}“ abgeschlossen.</p>
      <p class="merk" style="text-align:left">${st.merksatz}</p>
      <p style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap">
        ${next ? `<button type="button" class="btn primary" data-station="${next.id}">Weiter zu: ${next.title}</button>` : `<span>Du hast alle Stationen geschafft. Stark!</span>`}
        <button type="button" class="btn" data-act="home">Zur Übersicht</button>
      </p>
    </div>`;
  focusEl(document.getElementById("h"));
}

/* ================= Aufgabentypen ================= */
const TYPES = {
  info: {
    html: s => `<div>${fmt(s.html)}</div>`,
    bind: (s, ok) => ok(true)
  },
  summary: {
    html: s => `${fmt(s.intro || "")}<div class="muster"><p class="muster-h">Musterlösung</p>${s.html}</div>${LEGEND}`,
    bind: (s, ok) => ok(true)
  },
  mc: {
    html: s => {
      const order = s.keep ? s.opts.map((x, i) => i) : shuffle(s.opts.map((x, i) => i));
      return `<div class="opts" role="group" aria-labelledby="stepQ">${order.map(i =>
        `<button type="button" class="opt" data-i="${i}"><span class="mk" aria-hidden="true"></span><span>${s.opts[i].t}<span class="sr st"></span></span></button>`).join("")}</div>`;
    },
    bind: (s, ok, root) => {
      root.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        const o = s.opts[+b.dataset.i];
        if(o.ok){
          root.querySelectorAll(".opt").forEach(x => x.disabled = true);
          b.classList.add("is-ok"); b.querySelector(".mk").textContent = "✓"; b.querySelector(".st").textContent = " (richtig)";
          feedback("ok", o.fb || s.ok || ""); ok();
        } else {
          b.classList.add("is-bad"); b.disabled = true; b.querySelector(".mk").textContent = "✗"; b.querySelector(".st").textContent = " (falsch)";
          feedback("bad", (o.fb || "Lies den Gesetzestext noch einmal genau.") + " Versuch es noch einmal.");
        }
      }));
    }
  },
  mark: {
    html: (s, st) => `
      <p class="small">Tippe einen oder mehrere Teile an. Tippe erneut, um die Auswahl aufzuheben. Dann „Prüfen“.</p>
      <div class="case" aria-label="Sachverhalt zum Antippen"><p class="case-title">${st.case.title}</p>
      <p>${st.case.segs.map((t, i) => `<button type="button" class="seg" aria-pressed="false" data-i="${i}">${t}</button>`).join(" ")}</p></div>
      <button type="button" class="btn primary" id="chk">Prüfen</button>`,
    bind: (s, ok, root) => {
      const segs = [...root.querySelectorAll(".seg")];
      segs.forEach(b => b.addEventListener("click", () => {
        b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
        segs.forEach(x => x.classList.remove("is-bad"));
      }));
      root.querySelector("#chk").addEventListener("click", () => {
        const sel = segs.filter(b => b.getAttribute("aria-pressed") === "true").map(b => +b.dataset.i);
        if(!sel.length){ feedback("hint", "Tippe zuerst mindestens einen Teil des Sachverhalts an."); return; }
        const wrong = sel.filter(x => !s.targets.includes(x));
        const missing = s.targets.filter(x => !sel.includes(x));
        if(!wrong.length && !missing.length){
          segs.forEach(b => { b.disabled = true; if(s.targets.includes(+b.dataset.i)) b.classList.add("is-ok"); });
          root.querySelector("#chk").disabled = true;
          feedback("ok", s.ok); ok();
        } else if(wrong.length){
          wrong.forEach(x => segs[x].classList.add("is-bad"));
          feedback("bad", ((s.hints && s.hints[wrong[0]]) || "Dieser Teil ist für das Merkmal nicht entscheidend.") + " Der rot markierte Teil gehört nicht dazu.");
        } else {
          feedback("hint", s.targets.length > 1 ? "Das ist schon richtig, aber es fehlt noch etwas. Du brauchst mehr als einen Teil." : "Es fehlt noch der entscheidende Teil.");
        }
      });
    }
  },
  number: {
    html: s => `<div class="num-in"><label for="numIn">Deine Antwort:</label><input id="numIn" type="text" inputmode="decimal" autocomplete="off"><span>${s.unit || ""}</span><button type="button" class="btn primary" id="chk">Prüfen</button></div>`,
    bind: (s, ok, root) => {
      const inp = root.querySelector("#numIn"), btn = root.querySelector("#chk");
      const check = () => {
        const raw = inp.value.trim().replace(",", ".");
        if(raw === ""){ feedback("hint", "Gib zuerst eine Zahl ein."); return; }
        const v = Number(raw);
        if(Number.isNaN(v)){ feedback("hint", "Bitte gib nur eine Zahl ein, zum Beispiel 12."); return; }
        if(v === s.answer){ inp.disabled = true; btn.disabled = true; feedback("ok", s.ok); ok(); }
        else feedback("bad", (s.hints && s.hints[String(v)]) || "Rechne noch einmal nach.");
      };
      btn.addEventListener("click", check);
      inp.addEventListener("keydown", e => { if(e.key === "Enter") check(); });
    }
  },
  assign: {
    html: s => `${s.items.map((it, i) => `
      <div class="arow" data-i="${i}"><span id="a${i}">${it.t}</span>
        <select aria-labelledby="a${i}"><option value="">– bitte wählen –</option>${s.cats.map((c, ci) => `<option value="${ci}">${c}</option>`).join("")}</select>
        <span class="astat" aria-live="off"></span></div>`).join("")}
      <p><button type="button" class="btn primary" id="chk">Prüfen</button></p>`,
    bind: (s, ok, root) => {
      const rows = [...root.querySelectorAll(".arow")];
      root.querySelector("#chk").addEventListener("click", () => {
        let allOk = true, empty = false, firstFb = "";
        rows.forEach(r => {
          const it = s.items[+r.dataset.i], sel = r.querySelector("select"), stat = r.querySelector(".astat");
          r.classList.remove("is-ok", "is-bad");
          if(sel.value === ""){ empty = true; allOk = false; stat.textContent = ""; return; }
          if(+sel.value === it.c){ r.classList.add("is-ok"); stat.textContent = "✓ richtig"; }
          else { allOk = false; r.classList.add("is-bad"); stat.textContent = "✗ passt noch nicht" + (it.fb ? " – " + it.fb : ""); if(!firstFb && it.fb) firstFb = it.fb; }
        });
        if(allOk){ rows.forEach(r => r.querySelector("select").disabled = true); root.querySelector("#chk").disabled = true; feedback("ok", s.ok || "Alles richtig."); ok(); }
        else if(empty && !rows.some(r => r.classList.contains("is-bad"))) feedback("hint", "Wähle bei jeder Zeile eine Antwort aus.");
        else { const nBad = rows.filter(r => r.classList.contains("is-bad")).length; feedback("bad", `${nBad} Zuordnung${nBad === 1 ? " passt" : "en passen"} noch nicht. Die Zeilen sind mit ✗ markiert.` + (empty ? " Außerdem fehlen noch Antworten." : "")); }
      });
    }
  },
  order: {
    html: s => `<p class="small">Verschiebe die Schritte mit den Pfeil-Knöpfen.</p><ol class="olist" id="ol"></ol><p><button type="button" class="btn primary" id="chk">Prüfen</button></p>`,
    bind: (s, ok, root) => {
      let order = shuffle(s.items.map((x, i) => i));
      while(order.every((v, i) => v === i) && s.items.length > 1) order = shuffle(order);
      let locked = false;
      const ol = root.querySelector("#ol");
      const draw = (focusIdx, dir) => {
        ol.innerHTML = order.map((it, p) => `<li data-p="${p}"><span class="pos" aria-hidden="true">${p + 1}</span><span class="ot">${s.items[it]}</span>
          <button type="button" class="mv" data-dir="-1" data-p="${p}" aria-label="Nach oben: ${s.items[it]}" ${p === 0 || locked ? "disabled" : ""}>↑</button>
          <button type="button" class="mv" data-dir="1" data-p="${p}" aria-label="Nach unten: ${s.items[it]}" ${p === order.length - 1 || locked ? "disabled" : ""}>↓</button></li>`).join("");
        if(focusIdx != null){
          let b = ol.querySelector(`.mv[data-p="${focusIdx}"][data-dir="${dir}"]`);
          if(!b || b.disabled) b = ol.querySelector(`.mv[data-p="${focusIdx}"]:not(:disabled)`);
          if(b) b.focus();
        }
      };
      ol.addEventListener("click", e => {
        const b = e.target.closest(".mv"); if(!b || locked) return;
        const p = +b.dataset.p, d = +b.dataset.dir, q = p + d;
        [order[p], order[q]] = [order[q], order[p]];
        draw(q, d); clearFeedback();
      });
      draw();
      root.querySelector("#chk").addEventListener("click", () => {
        const lis = [...ol.children];
        const good = order.every((v, i) => v === i);
        lis.forEach((li, p) => li.classList.toggle("is-ok", order[p] === p));
        lis.forEach((li, p) => li.classList.toggle("is-bad", order[p] !== p));
        if(good){ locked = true; draw(); [...ol.children].forEach(li => li.classList.add("is-ok")); root.querySelector("#chk").disabled = true; feedback("ok", s.ok); ok(); }
        else { const n = order.filter((v, i) => v !== i).length; feedback("bad", `${n} Schritte stehen noch an der falschen Stelle. Tipp: Womit fängst du an – mit dem Fall oder mit dem Gesetz?`); }
      });
    }
  },
  write: {
    html: s => `
      <label for="wt"><strong>Deine Subsumtion:</strong></label>
      <p class="small">Bausteine einfügen (an der Cursor-Position):</p>
      <div class="bausteine">${["Nach § … SGB III ist Voraussetzung, dass … .", "Dies ist hier der Fall, weil … .", "Dies ist hier nicht der Fall, weil … .", "Somit ist das Merkmal erfüllt.", "Somit ist das Merkmal nicht erfüllt."]
        .map(b => `<button type="button" class="btn bs">${b}</button>`).join("")}</div>
      <textarea id="wt" spellcheck="true"></textarea>
      <p style="display:flex;gap:.5rem;flex-wrap:wrap"><button type="button" class="btn primary" id="chk">Kurz-Check</button><button type="button" class="btn" id="rev">Musterlösung zeigen</button></p>
      <div id="chkOut"></div>
      <div id="revOut"></div>`,
    bind: (s, ok, root) => {
      const ta = root.querySelector("#wt");
      root.querySelectorAll(".bs").forEach(b => b.addEventListener("click", () => {
        const t = b.textContent, st0 = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
        const pre = v.slice(0, st0), sep = pre && !/\s$/.test(pre) ? " " : "";
        ta.value = pre + sep + t + v.slice(en);
        const pos = (pre + sep + t).length; ta.focus(); ta.setSelectionRange(pos, pos);
      }));
      root.querySelector("#chk").addEventListener("click", () => {
        const t = ta.value;
        if(t.trim().length < 20){ feedback("hint", "Schreib zuerst deine Subsumtion – mindestens einen vollständigen Satz."); return; }
        const res = s.checks.map(c => ({ l: c.l, y: c.f(t) }));
        const n = res.filter(r => r.y).length;
        root.querySelector("#chkOut").innerHTML = `<h3>Kurz-Check: ${n} von ${res.length} Bausteinen gefunden</h3><ul class="checks">${res.map(r => `<li><span class="${r.y ? "y" : "n"}" aria-hidden="true">${r.y ? "✓" : "✗"}</span> ${r.l}<span class="sr">${r.y ? ": gefunden" : ": nicht gefunden"}</span></li>`).join("")}</ul>
          <p class="small">Der Kurz-Check sucht nur nach Wörtern und Zahlen. Vergleiche zusätzlich mit der Musterlösung.</p>`;
        feedback(n === res.length ? "ok" : "hint", n === res.length ? "Alle Bausteine sind da. Vergleiche jetzt mit der Musterlösung." : "Ergänze die mit ✗ markierten Punkte. Die Liste steht unter deinem Text.");
      });
      root.querySelector("#rev").addEventListener("click", () => {
        root.querySelector("#revOut").innerHTML = `<div class="muster"><p class="muster-h">Musterlösung</p>${s.model}</div>${LEGEND}
          <h3>Selbstcheck</h3><p class="small">Hake ab, was in deiner Lösung steht.</p>
          ${SELBSTCHECK.map((c, i) => `<p><input type="checkbox" id="sc${i}"> <label for="sc${i}">${c}</label></p>`).join("")}`;
        root.querySelector("#rev").disabled = true;
        feedback("hint", "Die Musterlösung ist unter deinem Text. Es gibt nicht nur eine richtige Formulierung – entscheidend ist, dass Gesetz, Tatsache, Vergleich und Ergebnis verbunden sind.");
        ok();
        root.querySelector("#revOut h3").setAttribute("tabindex", "-1");
      });
    }
  },
  speed: {
    html: s => `
      <p><input type="checkbox" id="noTime"> <label for="noTime">Ohne Zeitdruck üben (Timer aus)</label></p>
      <p class="small" id="rc">Runden geschafft: 0 von ${s.rounds}</p>
      <p><button type="button" class="btn primary" id="newCase">Fall ziehen</button></p>
      <div id="sp"></div>`,
    bind: (s, ok, root) => {
      let rounds = 0, cur = null;
      const sp = root.querySelector("#sp");
      const reveal = () => {
        stopTimer();
        sp.querySelector("#revealBtn")?.remove();
        sp.insertAdjacentHTML("beforeend", `
          <dl class="reveal">
            <dt>Norm</dt><dd>${cur.norm}</dd>
            <dt>Merkmal</dt><dd>${cur.merkmal}</dd>
            <dt>Tatsache</dt><dd>${cur.tatsache}</dd>
            <dt>Ergebnis</dt><dd>${cur.ergebnis}</dd>
          </dl>
          <p><strong>Wie lief es?</strong></p>
          <p style="display:flex;gap:.5rem;flex-wrap:wrap"><button type="button" class="btn rate" data-r="1">Hatte ich alle vier</button><button type="button" class="btn rate" data-r="0">Da fehlte noch etwas</button></p>`);
        sp.querySelectorAll(".rate").forEach(b => b.addEventListener("click", () => {
          rounds++;
          root.querySelector("#rc").textContent = `Runden geschafft: ${Math.min(rounds, s.rounds)} von ${s.rounds}`;
          sp.querySelectorAll(".rate").forEach(x => x.disabled = true);
          const good = b.dataset.r === "1";
          if(rounds >= s.rounds){ feedback("ok", (good ? "Sehr gut! " : "Gut, dass du ehrlich bist. ") + "Du hast genug Runden für diese Station. Du kannst weiter üben oder die Station abschließen."); ok(); }
          else feedback(good ? "ok" : "hint", good ? "Weiter so! Zieh den nächsten Fall." : "Kein Problem. Schau dir die Lösung noch einmal an und zieh dann den nächsten Fall.");
          root.querySelector("#newCase").focus();
        }));
        sp.querySelector("dl").setAttribute("tabindex", "-1"); sp.querySelector("dl").focus();
      };
      root.querySelector("#newCase").addEventListener("click", () => {
        stopTimer(); clearFeedback();
        cur = genSpeed();
        const noTime = root.querySelector("#noTime").checked;
        sp.innerHTML = `<div class="case"><p class="case-title">Kurzfall</p><p class="speed-case">${cur.text}</p></div>
          ${noTime ? "" : `<p>Zeit: <span class="timer" id="tm" aria-live="off">30</span> Sekunden</p>`}
          <p><button type="button" class="btn primary" id="revealBtn">Lösung aufdecken</button></p>`;
        sp.querySelector("#revealBtn").addEventListener("click", reveal);
        sp.querySelector(".speed-case").setAttribute("tabindex", "-1"); sp.querySelector(".speed-case").focus();
        if(!noTime){
          let t = 30;
          timerId = setInterval(() => {
            t--; const tm = document.getElementById("tm"); if(tm){ tm.textContent = t; tm.classList.toggle("low", t <= 10); }
            if(t <= 0){ stopTimer(); feedback("hint", "Die Zeit ist um. Deck jetzt die Lösung auf."); }
          }, 1000);
        }
      });
    }
  }
};

/* Zufallsfälle für die Bonus-Runde */
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function genSpeed(){
  const name = pick(["Herr Arslan", "Frau Becker", "Herr Nowak", "Frau Wolf", "Herr Hoffmann", "Frau Petrović", "Herr Schulz", "Frau Kaya"]);
  const job = pick(["als Aushilfe in einer Tankstelle", "im Lager eines Getränkehandels", "als Servicekraft in einem Restaurant", "in einer Gärtnerei"]);
  const r = Math.random();
  if(r < 0.4){
    const h = pick([9, 11, 12, 14, 15, 16, 17]);
    return { text: `${name} arbeitet neben der Arbeitssuche ${h} Stunden pro Woche ${job}. Prüfe die Arbeitszeit.`,
      norm: "§ 138 Abs. 3 SGB III", merkmal: "Arbeitszeit weniger als 15 Stunden wöchentlich", tatsache: `${h} Stunden pro Woche`,
      ergebnis: h < 15 ? `erfüllt – ${h} Stunden sind weniger als 15 Stunden` : `nicht erfüllt – ${h} Stunden sind nicht weniger als 15 Stunden` };
  }
  if(r < 0.7){
    const a = pick([5, 6, 7, 8, 9]), b = pick([4, 5, 6, 7, 8]), s = a + b;
    return { text: `${name} arbeitet neben der Arbeitssuche ${a} Stunden pro Woche ${job} und zusätzlich ${b} Stunden pro Woche als Zeitungszusteller. Prüfe die Arbeitszeit.`,
      norm: "§ 138 Abs. 3 SGB III", merkmal: "Arbeitszeit weniger als 15 Stunden wöchentlich; mehrere Erwerbstätigkeiten werden zusammengerechnet", tatsache: `${a} + ${b} = ${s} Stunden pro Woche`,
      ergebnis: s < 15 ? `erfüllt – ${s} Stunden sind weniger als 15 Stunden` : `nicht erfüllt – ${s} Stunden sind nicht weniger als 15 Stunden` };
  }
  const m = pick([6, 9, 11, 12, 13, 18, 24]);
  return { text: `${name} war in der maßgeblichen Rahmenfrist ${m} Monate versicherungspflichtig beschäftigt. Prüfe die Anwartschaftszeit.`,
    norm: "§ 142 Abs. 1 SGB III", merkmal: "mindestens 12 Monate Versicherungspflichtverhältnis in der Rahmenfrist", tatsache: `${m} Monate`,
    ergebnis: m >= 12 ? `erfüllt – ${m} Monate sind mindestens 12 Monate${m === 12 ? " (bei „mindestens“ zählt die 12 mit!)" : ""}` : `nicht erfüllt – ${m} Monate sind weniger als 12 Monate` };
}

/* ================= Merksätze & Glossar ================= */
function showMerk(){
  stopTimer();
  app.innerHTML = `<h1 id="h">Merksätze</h1><p>Die wichtigsten Regeln zum Subsumieren auf einen Blick.</p>
    ${MERKSAETZE.map(m => `<p class="merk">${m}</p>`).join("")}
    <h2>Selbstcheck vor der Abgabe</h2><ul>${SELBSTCHECK.map(c => `<li>${c}</li>`).join("")}</ul>`;
  focusEl(document.getElementById("h"));
}
function showGloss(){
  stopTimer();
  const keys = Object.keys(GLOSSAR).sort((a, b) => a.localeCompare(b, "de"));
  app.innerHTML = `<h1 id="h">Glossar</h1><p>Fachbegriffe in einfacher Sprache.</p>
    <dl class="glist">${keys.map(k => `<dt>${k}</dt><dd>${GLOSSAR[k]}</dd>`).join("")}</dl>`;
  focusEl(document.getElementById("h"));
}

/* ================= Globale Ereignisse ================= */
const dlg = document.getElementById("gdlg");
let lastTermBtn = null;
document.addEventListener("click", e => {
  const term = e.target.closest(".term");
  if(term){
    const k = term.dataset.term;
    lastTermBtn = term;
    document.getElementById("gdlgT").textContent = k;
    document.getElementById("gdlgX").textContent = GLOSSAR[k] || "Keine Erklärung vorhanden.";
    if(dlg.showModal) dlg.showModal(); else alert(k + ": " + (GLOSSAR[k] || ""));
    return;
  }
  const st = e.target.closest("[data-station]");
  if(st){ showStation(st.dataset.station); return; }
  const act = e.target.closest("[data-act]");
  if(act){
    const a = act.dataset.act;
    if(a === "home") showHome();
    else if(a === "merk") showMerk();
    else if(a === "gloss") showGloss();
    else if(a === "unlock"){ state.unlockAll = true; save(); showHome(); }
    else if(a === "reset"){ if(confirm("Möchtest du deinen Fortschritt wirklich löschen?")){ state = { done: {}, unlockAll: false }; save(); showHome(); } }
  }
});
document.getElementById("gdlgClose").addEventListener("click", () => dlg.close());
dlg.addEventListener("close", () => { if(lastTermBtn && document.body.contains(lastTermBtn)) lastTermBtn.focus(); });
dlg.addEventListener("click", e => { if(e.target === dlg) dlg.close(); });

load();
showHome();
</script>
